version: '3.8'

# Phonos Single GPU Worker Deployment
# For systems with only ONE GPU - runs workers sequentially on GPU 0
#
# Usage:
#   docker-compose -f docker-compose.single-gpu.yml up -d

services:
  esmfold-worker:
    build:
      context: ../../../node1-esm
      dockerfile: Dockerfile
    image: phonos/esmfold-worker:latest
    container_name: phonos-esmfold-worker
    restart: unless-stopped
    environment:
      - WORKER_TYPE=type-0
      - WORKER_ID=publisher-node-type-0
      - WORKER_HEARTBEAT_INTERVAL=${WORKER_HEARTBEAT_INTERVAL:-30}
      - JOB_TIMEOUT=${ESMFOLD_JOB_TIMEOUT:-600}
      - PREFERRED_GPU=0
      - CUDA_VISIBLE_DEVICES=0
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SSL=${REDIS_SSL:-false}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TRANSFORMERS_CACHE=/app/cache
      - TORCH_HOME=/app/cache
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - esmfold-cache:/app/cache
      - esmfold-logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "100m"

  diffdock-worker:
    build:
      context: ../../../diffdock
      dockerfile: Dockerfile
    image: phonos/diffdock-worker:latest
    container_name: phonos-diffdock-worker
    restart: unless-stopped
    environment:
      - WORKER_TYPE=type-3
      - WORKER_ID=publisher-node-type-3
      - WORKER_HEARTBEAT_INTERVAL=${WORKER_HEARTBEAT_INTERVAL:-30}
      - JOB_TIMEOUT=${DIFFDOCK_JOB_TIMEOUT:-1200}
      # Same GPU as ESMFold (single GPU mode)
      - PREFERRED_GPU=0
      - CUDA_VISIBLE_DEVICES=0
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SSL=${REDIS_SSL:-false}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DIFFDOCK_INSTALL_DIR=/opt/DiffDock
      - DIFFDOCK_CONDA_ENV=diffdock
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - diffdock-cache:/app/cache
      - diffdock-install:/opt/DiffDock
      - diffdock-logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "100m"

volumes:
  esmfold-cache:
  esmfold-logs:
  diffdock-cache:
  diffdock-install:
  diffdock-logs:
