apiVersion: apps/v1
kind: Deployment
metadata:
  name: esmfold-worker
  namespace: phonos-workers
  labels:
    app.kubernetes.io/name: phonos
    app.kubernetes.io/component: esmfold-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: phonos
      app.kubernetes.io/component: esmfold-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phonos
        app.kubernetes.io/component: esmfold-worker
    spec:
      containers:
        - name: esmfold-worker
          image: phonos/esmfold-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            # Worker identification
            - name: WORKER_TYPE
              value: "type-0"
            - name: WORKER_ID
              value: "publisher-node-type-0"

            # GPU Configuration - ESMFold uses GPU 0
            - name: PREFERRED_GPU
              value: "0"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "0"

            # Redis connection from ConfigMap
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: phonos-workers-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: phonos-workers-config
                  key: REDIS_PORT
            - name: REDIS_DB
              valueFrom:
                configMapKeyRef:
                  name: phonos-workers-config
                  key: REDIS_DB
            - name: REDIS_SSL
              valueFrom:
                configMapKeyRef:
                  name: phonos-workers-config
                  key: REDIS_SSL

            # Secrets
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: phonos-workers-secret
                  key: REDIS_PASSWORD
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: phonos-workers-secret
                  key: ENCRYPTION_KEY

            # Worker configuration
            - name: WORKER_HEARTBEAT_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: phonos-workers-config
                  key: WORKER_HEARTBEAT_INTERVAL
            - name: JOB_TIMEOUT
              value: "600"

            # Model cache
            - name: TRANSFORMERS_CACHE
              valueFrom:
                configMapKeyRef:
                  name: phonos-workers-config
                  key: TRANSFORMERS_CACHE
            - name: TORCH_HOME
              valueFrom:
                configMapKeyRef:
                  name: phonos-workers-config
                  key: TORCH_HOME

            # Performance
            - name: PYTORCH_JIT
              valueFrom:
                configMapKeyRef:
                  name: phonos-workers-config
                  key: PYTORCH_JIT
            - name: OMP_NUM_THREADS
              valueFrom:
                configMapKeyRef:
                  name: phonos-workers-config
                  key: OMP_NUM_THREADS

          resources:
            requests:
              memory: "16Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
            limits:
              memory: "32Gi"
              cpu: "8"
              nvidia.com/gpu: "1"

          volumeMounts:
            - name: model-cache
              mountPath: /app/cache
            - name: logs
              mountPath: /app/logs

          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import redis; r = redis.Redis(host='${REDIS_HOST}', port=int('${REDIS_PORT}'), password='${REDIS_PASSWORD}'); r.ping()"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10

      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: esmfold-model-cache
        - name: logs
          emptyDir: {}

      # Node selector for GPU nodes
      nodeSelector:
        nvidia.com/gpu: "true"

      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: esmfold-model-cache
  namespace: phonos-workers
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard  # Adjust based on your cluster
