[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "phonos-sdk"
version = "1.0.0"
description = "Python SDK for the Phonos computational biology platform"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "FyreFlySystems", email = "support@fyreflysystems.de"}
]
maintainers = [
    {name = "FyreFlySystems", email = "support@fyreflysystems.de"}
]
keywords = [
    "phonos",
    "biology",
    "bioinformatics",
    "protein-folding",
    "computational-biology",
    "api-client",
    "sdk"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[project.urls]
Homepage = "https://phonos.fyreflysystems.de"
Documentation = "https://phonos.fyreflysystems.de/docs"
Repository = "https://github.com/FyreFly-Systems/phonos-sdk-python"
Issues = "https://github.com/FyreFly-Systems/phonos-sdk-python/issues"

[tool.setuptools]
packages = ["phonos_sdk", "phonos_sdk.resources"]

[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
