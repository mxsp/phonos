name: Package Release (Linux Binary + Container)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxrender1 libxext6 libexpat1
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install . "pyinstaller>=6.10"
      - name: Build Linux standalone binary
        run: chmod +x packaging/build-exe.sh && ./packaging/build-exe.sh
      - name: Archive Linux release bundle
        run: |
          mkdir -p release-assets
          tar -czf release-assets/phonos-linux-x64.tar.gz -C packaging/dist phonos start-playground.sh start-production.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-assets/phonos-linux-x64.tar.gz

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Phonos dual-mode container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: phonos:latest

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-binary, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum phonos-linux-x64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          prerelease: false
          files: |
            release-assets/phonos-linux-x64.tar.gz
            release-assets/SHA256SUMS.txt
