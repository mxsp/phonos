[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phonos"
version = "1.0.0"
description = "Self-hosted computational biology, 3D molecular structure, Python notebook, and Bio-AI discovery workbench"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "mxsp / FyreFly Systems GbR" }]
dependencies = [
  "Flask>=3.1.0,<4.0",
  "Werkzeug>=3.1.0,<4.0",
  "Flask-SocketIO>=5.3.6,<6.0",
  "Flask-Compress>=1.15",
  "Flask-Mail>=0.10.0",
  "gunicorn>=23.0.0; sys_platform != 'win32'",
  "waitress>=3.0.0; sys_platform == 'win32'",
  "eventlet>=0.39.0",
  "psycopg2-binary>=2.9.9",
  "psycogreen>=1.0.2",
  "redis>=5.0.0",
  "bcrypt>=4.2.0",
  "cryptography>=43.0.0",
  "pycryptodome>=3.21.0",
  "PyJWT>=2.9.0",
  "Authlib>=1.3.2",
  "APScheduler>=3.10.4",
  "bleach>=6.1.0",
  "Pillow>=10.4.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
  "pyzmq>=26.0.0",
  "stripe>=10.0.0",
  "biopython>=1.84",
  "rdkit>=2024.3.5",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "flake8>=7.0",
]
quantum = [
  "qiskit>=1.0",
  "qiskit-aer>=0.14",
  "qiskit-ibm-runtime>=0.23",
]
docker = [
  "docker>=7.0",
]
geoip = [
  "geoip2>=4.8",
]

[project.scripts]
phonos = "phonos_app.cli:main"

[tool.setuptools.packages.find]
include = ["phonos_app*", "production*", "phonos_lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
