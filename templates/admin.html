<!DOCTYPE html>
<html lang="{{ user_language|default('en') }}">
<head>
    <script>(function(){document.documentElement.setAttribute("data-theme","dark");})();</script>
    {% include '_google_analytics.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="admin.pageTitle">Phonos - Admin Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/inter.css') }}?v=6248268e">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=6e8a3deb">
    {% include '_i18n_scripts.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/brutalist.css') }}?v=9e43b44e">
    <script src="{{ url_for('static', filename='js/grid-snap.js') }}?v=191f838c" data-snap=".card, .dash-v4-panel, .dash-v4-command-bar, .dash-v4-stat-card, .page-container > .page-header, .hero-banner, .auth-card, .stats-overview-item, .model-table" data-snap-skip=".modal .card, .modal-content .card, .dropdown-menu .card" defer></script>
</head>
<body>
    <div style="padding: var(--space-6); max-width: 1400px; margin: 0 auto;">
        <div class="flex justify-between items-center" style="margin-bottom: var(--space-6);">
            <div>
                <h1 data-i18n="admin.title">Admin Panel</h1>
                <p class="text-muted" data-i18n="admin.monitoring">System monitoring and management</p>
            </div>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary" data-i18n="admin.backToDashboard">Back to Dashboard</a>
        </div>

        <div class="grid grid-4" style="margin-bottom: var(--space-6);" id="admin-stats">
            <!-- Stats loaded via JavaScript -->
        </div>

        <div class="grid grid-2" style="gap: var(--space-4);">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title" data-i18n="admin.activeWorkers">Active Workers</h3>
                </div>
                <div class="card-body" id="workers-list">
                    <div class="spinner"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title" data-i18n="admin.recentActivity">Recent Activity</h3>
                </div>
                <div class="card-body" id="activity-list">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <div class="card" style="margin-top: var(--space-4);">
            <div class="card-header">
                <h3 class="card-title" data-i18n="admin.userManagement">User Management</h3>
            </div>
            <div class="card-body" style="padding: 0;" id="users-table">
                <div class="spinner" style="padding: var(--space-4);"></div>
            </div>
        </div>
    </div>

    <script>
        async function loadAdminData() {
            try {
                const stats = await fetch('/api/admin/stats').then(r => r.json());

                const totalUsersText = window.i18n ? window.i18n.t('admin.totalUsers') : 'Total Users';
                const activeWorkersText = window.i18n ? window.i18n.t('admin.activeWorkers') : 'Active Workers';
                const jobsTodayText = window.i18n ? window.i18n.t('admin.jobsToday') : 'Jobs Today';
                const totalProjectsText = window.i18n ? window.i18n.t('admin.totalProjects') : 'Total Projects';

                document.getElementById('admin-stats').innerHTML = `
                    <div class="card"><div class="card-body">
                        <div class="text-sm text-muted">${totalUsersText}</div>
                        <div style="font-size: var(--text-2xl); font-weight: 600;">${stats.total_users || 0}</div>
                    </div></div>
                    <div class="card"><div class="card-body">
                        <div class="text-sm text-muted">${activeWorkersText}</div>
                        <div style="font-size: var(--text-2xl); font-weight: 600;">${stats.active_workers || 0}</div>
                    </div></div>
                    <div class="card"><div class="card-body">
                        <div class="text-sm text-muted">${jobsTodayText}</div>
                        <div style="font-size: var(--text-2xl); font-weight: 600;">${stats.jobs_today || 0}</div>
                    </div></div>
                    <div class="card"><div class="card-body">
                        <div class="text-sm text-muted">${totalProjectsText}</div>
                        <div style="font-size: var(--text-2xl); font-weight: 600;">${stats.total_projects || 0}</div>
                    </div></div>
                `;

                const workers = await fetch('/api/workers').then(r => r.json());
                const noActiveWorkersText = window.i18n ? window.i18n.t('admin.noActiveWorkers') : 'No active workers';
                
                document.getElementById('workers-list').innerHTML = workers.length ? workers.map(w => `
                    <div class="file-item">
                        <div class="job-status">
                            <span class="job-status-dot ${w.status === 'active' ? 'completed' : 'pending'}"></span>
                        </div>
                        <div class="file-info">
                            <div class="file-name">${w.node_id}</div>
                            <div class="file-meta">${w.worker_types?.join(', ') || 'Unknown'}</div>
                        </div>
                    </div>
                `).join('') : `<p class="text-muted">${noActiveWorkersText}</p>`;

            } catch (error) {
                console.error('Error loading admin data:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadAdminData);
    </script>
</body>
</html>
