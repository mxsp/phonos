<!DOCTYPE html>
<html lang="{{ user_language|default('en') }}">
<head>
    <script>(function(){document.documentElement.setAttribute("data-theme","dark");})();</script>
    {% include '_i18n_scripts.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="offline.page_title">Phonos - Offline</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        :root {
            --color-bg: #0a0a0c;
            --color-surface: #141418;
            --color-text: #fafafa;
            --color-text-secondary: #a1a1aa;
            --color-primary: #10B981;
            --color-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .offline-container {
            max-width: 400px;
            width: 100%;
        }

        .offline-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 1.5rem;
            opacity: 0.5;
            color: var(--color-text-secondary);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        p {
            color: var(--color-text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .retry-btn {
            padding: 0.875rem 2rem;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--r-ui, 0px);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .retry-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .retry-btn:active {
            transform: translateY(0);
        }

        .retry-btn svg {
            width: 18px;
            height: 18px;
        }

        .status-info {
            margin-top: 3rem;
            padding: 1rem;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--r-ui, 0px);
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        .status-info p {
            margin-bottom: 0;
        }

        @media (max-width: 480px) {
            body {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.25rem;
            }

            p {
                font-size: 0.9375rem;
            }

            .offline-icon {
                width: 64px;
                height: 64px;
            }
        }

        /* Safe area for notch devices */
        @supports (padding: env(safe-area-inset-top)) {
            body {
                padding-top: calc(2rem + env(safe-area-inset-top));
                padding-bottom: calc(2rem + env(safe-area-inset-bottom));
                padding-left: calc(2rem + env(safe-area-inset-left));
                padding-right: calc(2rem + env(safe-area-inset-right));
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <svg class="offline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M1 1l22 22" stroke-linecap="round"/>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <circle cx="12" cy="20" r="1"/>
        </svg>

        <h1 data-i18n="offline.title">You're Offline</h1>

        <p data-i18n="offline.message">
            It looks like you've lost your internet connection.
            Some features may not be available until you're back online.
        </p>

        <button class="retry-btn" onclick="window.location.reload()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 4v6h-6"/>
                <path d="M1 20v-6h6"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
            <span data-i18n="offline.tryAgain">Try Again</span>
        </button>

        <div class="status-info">
            <p data-i18n="offline.cachedInfo">
                Cached data may still be available. Your work will sync when you're back online.
            </p>
        </div>
    </div>

    <script>
        // Auto-retry when connection is restored
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
