<!DOCTYPE html>
<html lang="{{ user_language|default('en') }}">
<head>
    <script>(function(){document.documentElement.setAttribute("data-theme","dark");})();</script>
    {% include '_google_analytics.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="userTicketView.pageTitle">Phonos - Ticket #{{ ticket_id }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/inter.css') }}?v=6248268e">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=6e8a3deb">
    {% include '_i18n_scripts.html' %}
        <link rel="stylesheet" href="{{ url_for('static', filename='css/brutalist.css') }}?v=9e43b44e">
        <script src="{{ url_for('static', filename='js/grid-snap.js') }}?v=191f838c" data-snap=".card, .dash-v4-panel, .dash-v4-command-bar, .dash-v4-stat-card, .page-container > .page-header, .hero-banner, .auth-card, .stats-overview-item, .model-table" data-snap-skip=".modal .card, .modal-content .card, .dropdown-menu .card" defer></script>
</head>
    <body>
    <div style="padding: var(--space-6); max-width: 900px; margin: 0 auto;">
        <div class="flex justify-between items-center" style="margin-bottom: var(--space-6);">
            <h1><span data-i18n="userTicketView.ticket">Ticket</span> #{{ ticket_id }}</h1>
            <a href="{{ url_for('help_desk') }}" class="btn btn-secondary" data-i18n="helpdesk.backToHelpdesk">Back to Help Desk</a>
        </div>

        <div class="grid" style="gap: var(--space-4);">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title" id="ticket-subject" data-i18n="common.loading">Loading...</h3>
                    <span class="badge" id="ticket-status">-</span>
                </div>
                <div class="card-body">
                    <div class="flex gap-4" style="margin-bottom: var(--space-4);">
                        <div>
                            <span class="text-sm text-muted" data-i18n="helpdesk.category">Category:</span>
                            <span id="ticket-category">-</span>
                        </div>
                        <div>
                            <span class="text-sm text-muted" data-i18n="helpdesk.created">Created:</span>
                            <span id="ticket-created">-</span>
                        </div>
                    </div>
                    <div id="ticket-description" class="text-secondary"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title" data-i18n="helpdesk.conversation">Conversation</h3>
                </div>
                <div class="card-body" id="responses-list">
                    <p class="text-muted" data-i18n="helpdesk.noResponses">No responses yet</p>
                </div>
                <div class="card-footer">
                    <form id="response-form">
                        <div class="form-group" style="margin-bottom: var(--space-3);">
                            <textarea class="form-textarea" name="message" data-i18n-placeholder="helpdesk.addMessage" placeholder="Add a message..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" data-i18n="helpdesk.send">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ticketId = {{ ticket_id }};
        const CSRF_TOKEN = {{ csrf_token | tojson }};
        const escapeHtml = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        async function loadTicket() {
            try {
                const response = await fetch(`/api/tickets/${ticketId}`, { credentials: 'same-origin' });
                if (!response.ok) return;
                const payload = await response.json();
                // GET /api/tickets/<id> -> { ticket: {..., message}, replies: [...] }
                const ticket = Object.assign({}, payload.ticket, { responses: payload.replies || [] });

                document.getElementById('ticket-subject').textContent = ticket.subject;
                if (ticket.subject) document.getElementById('ticket-subject').removeAttribute('data-i18n');

                document.getElementById('ticket-category').textContent = ticket.category;
                document.getElementById('ticket-created').textContent = new Date(ticket.created_at).toLocaleString();
                document.getElementById('ticket-description').textContent = ticket.message;

                const statusEl = document.getElementById('ticket-status');
                statusEl.textContent = ticket.status;
                statusEl.className = `badge badge-${ticket.status === 'resolved' ? 'success' : ticket.status === 'open' ? 'warning' : 'info'}`;

                if (ticket.responses && ticket.responses.length > 0) {
                    const supportText = window.i18n ? window.i18n.t('helpdesk.support') : 'Support';
                    const youText = window.i18n ? window.i18n.t('helpdesk.you') : 'You';

                    document.getElementById('responses-list').innerHTML = ticket.responses.map(r => `
                        <div style="padding: var(--space-3); background: var(--color-bg-tertiary); border-radius: var(--radius-md); margin-bottom: var(--space-3);">
                            <div class="flex justify-between" style="margin-bottom: var(--space-2);">
                                <strong>${r.is_admin ? supportText : youText}</strong>
                                <span class="text-xs text-muted">${new Date(r.created_at).toLocaleString()}</span>
                            </div>
                            <div class="text-sm">${escapeHtml(r.message)}</div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading ticket:', error);
            }
        }

        document.getElementById('response-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            try {
                // POST /api/tickets/<id>/replies reads request.form['message']
                await fetch(`/api/tickets/${ticketId}/replies`, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'X-CSRF-Token': CSRF_TOKEN },
                    body: new URLSearchParams({ message: formData.get('message') })
                });

                e.target.reset();
                loadTicket();
            } catch (error) {
                console.error('Error sending message:', error);
            }
        });

        document.addEventListener('DOMContentLoaded', loadTicket);
    </script>
</body>
</html>
